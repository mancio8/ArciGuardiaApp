version: "3.9"

services:
  capacitor-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capacitor-builder
    tty: true
    stdin_open: true
    volumes:
      - ./android:/app/android        # mappa la cartella android
      - ./www:/app/www                # mappa la cartella www
      - ./node_modules:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./resources:/app/resources
      - ./capacitor.config.json:/app/capacitor.config.json
      - ./android-sdk:/opt/android   # SDK Android persistente
    environment:
      ANDROID_HOME: /opt/android
      ANDROID_SDK_ROOT: /opt/android
      PATH: /opt/android/cmdline-tools/latest/bin:/opt/android/platform-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
